name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the minimum promised runtime rather than letting `lts/*` move
        # forward and silently stop testing it.
        node: [24, current]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `prepare` patches the local TypeScript with the Effect language
      # service, so `npm run check` reports Effect diagnostics too.
      - run: npm ci

      - name: Type check and type-misuse assertions
        run: npm run check

      - name: Effect language service diagnostics
        run: npm run lint

      - name: Conformance suite
        run: npm test

      - name: Build the published output
        run: npm run build

      # The tarball, not the working tree, is what a consumer resolves: an
      # `exports` entry pointing at a file `files` does not ship is invisible
      # to everything above this line.
      - name: Verify the package a consumer would install
        run: npm run verify-package

  experiments:
    name: architectural experiments (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deliberately separate from package conformance/prepack. The prototype
      # stays type-checked and tested without redefining publishability.
      - name: Type-check Layer + Atom experiments
        run: npm run check:experiments

      - name: Effect diagnostics for Layer + Atom experiments
        run: npm run lint:experiments

      - name: Test Layer + Atom experiments
        run: npm run test:experiments
